services:
  db:
    image: postgres:15
    container_name: vaerdia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaerdia-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vaerdia-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vaerdia.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: auth-service
    container_name: vaerdia-auth-service
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  project-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: project-service
    container_name: vaerdia-project-service
    environment:
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: project_db
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy

  client-portal-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: client-portal-service
    container_name: vaerdia-client-portal-service
    environment:
      PORT: 3003
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: client_portal_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  hr-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: hr-service
    container_name: vaerdia-hr-service
    environment:
      PORT: 3004
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: hr_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy

  reporting-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: reporting-service
    container_name: vaerdia-reporting-service
    environment:
      PORT: 3005
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: reporting_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy

  communication-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: communication-service
    container_name: vaerdia-communication-service
    environment:
      PORT: 3006
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: communication_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
    ports:
      - "3006:3006"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE_NAME: api-gateway
    container_name: vaerdia-api-gateway
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PROJECTS_SERVICE_URL: http://project-service:3002
      CLIENT_PORTAL_SERVICE_URL: http://client-portal-service:3003
      HR_SERVICE_URL: http://hr-service:3004
      REPORTING_SERVICE_URL: http://reporting-service:3005
      COMMUNICATION_SERVICE_URL: http://communication-service:3006
      USERS_SERVICE_URL: http://auth-service:3001
      AURA_SERVICE_URL: http://aura-service:3007
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_started
      project-service:
        condition: service_started
      client-portal-service:
        condition: service_started
      hr-service:
        condition: service_started
      communication-service:
        condition: service_started
      reporting-service:
        condition: service_started
      aura-service:
        condition: service_started
      redis:
        condition: service_healthy

  aura-service:
    build:
      context: ./backend/aura-service
    container_name: vaerdia-aura-service
    environment:
      DB_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/project_db
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "3007:3007"
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: vaerdia-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
