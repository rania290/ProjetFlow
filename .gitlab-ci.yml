stages:
  - build
  - test
  - analyse
  - deploy

build_job:
  stage: build
  image: alpine
  script:
    - echo "Build des images Docker..."
    - echo "Build terminé"

test_job:
  stage: test
  image: alpine
  script:
    - echo "Exécution des tests unitaires..."
    - echo "Tests Jest et Pytest terminés"

analyse_job:
  stage: analyse
  image: alpine
  script:
    - echo "Analyse statique du code..."
    - echo "ESLint et Pylint terminés"

deploy_job:
  stage: deploy
  image: alpine
  script:
    - echo "Déploiement en production..."
    - echo "docker compose up -d"
  only:
    - main